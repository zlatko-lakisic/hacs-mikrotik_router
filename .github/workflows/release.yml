name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_zip:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get version number
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/} # Remove refs/tags/
          TAG_NAME=${TAG_NAME#v}            # Remove leading v if present
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Update version number in manifest
        run: |
          python3 "${{ github.workspace }}/.github/update_version.py" --version $TAG_NAME

      - name: Zip mikrotik_router dir
        run: |
          cd "${{ github.workspace }}/custom_components/mikrotik_router"
          zip mikrotik_router.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/mikrotik_router/mikrotik_router.zip

  releasenotes:
    name: Prepare releasenotes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requirements
        run: |
          python3 -m pip install setuptools wheel PyGithub

      - name: Update release notes
        run: |
          python3 "${{ github.workspace }}/.github/generate_releasenotes.py" --token ${{ secrets.GITHUB_TOKEN }} --release yes --tag ${{ github.ref }}
